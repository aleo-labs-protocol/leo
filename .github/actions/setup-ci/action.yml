name: Set up Leo CI
description: Install the pinned toolchain, native build tools, and cached test dependencies.

inputs:
  cache-key:
    description: Separate build outputs by job, platform, profile, and features.
    required: true
  nextest:
    description: Install cargo-nextest.
    default: 'false'
  snarkos:
    description: Install snarkOS with local test-network support.
    default: 'false'

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@1.96.0
      with:
        components: clippy

    - name: Install libclang on Linux
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y libclang-dev

    - name: Configure libclang on macOS
      if: runner.os == 'macOS'
      shell: bash
      run: |
        clang_path="$(xcode-select -p)/Toolchains/XcodeDefault.xctoolchain/usr/lib"
        test -f "$clang_path/libclang.dylib"
        echo "LIBCLANG_PATH=$clang_path" >> "$GITHUB_ENV"
        echo "DYLD_LIBRARY_PATH=$clang_path:${DYLD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"

    - name: Configure libclang on Windows
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $llvmBin = 'C:\Program Files\LLVM\bin'
        if (!(Test-Path "$llvmBin\libclang.dll")) {
          choco install llvm --no-progress -y
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }
        "LIBCLANG_PATH=$llvmBin" >> $env:GITHUB_ENV

    - name: Clear source timestamps before cache restore
      if: runner.environment == 'github-hosted' || runner.os != 'Linux'
      shell: bash
      run: rm -f "$HOME/.cache/leo-ci-mtimes/project.json"

    - uses: Swatinem/rust-cache@v2
      if: runner.environment == 'github-hosted' || runner.os != 'Linux'
      with:
        prefix-key: source-mtime-v1-rust
        key: ${{ inputs.cache-key }}-${{ runner.environment }}
        cache-workspace-crates: true
        cache-directories: ~/.cache/leo-ci-mtimes
        save-if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

    - name: Restore unchanged source timestamps
      if: runner.environment == 'github-hosted' || runner.os != 'Linux'
      shell: bash
      run: |
        python_command=python3
        if [ "$RUNNER_OS" = Windows ]; then python_command=python; fi
        "$python_command" - . "$HOME/.cache/leo-ci-mtimes/project.json" <<'PYTHON'
        import hashlib
        import json
        import os
        from pathlib import Path
        import subprocess
        import sys


        root = Path(sys.argv[1]).resolve()
        manifest = Path(sys.argv[2])
        previous = json.loads(manifest.read_text()) if manifest.exists() else {}
        current = {}
        tracked = {
            os.fsdecode(path)
            for path in subprocess.check_output(
                ["git", "ls-files", "--cached", "--recurse-submodules", "-z"], cwd=root
            ).split(b"\0")
            if path
        }


        def restore(path, digest, dirty=False):
            name = path.relative_to(root).as_posix()
            if path.is_dir():
                name += "/"
            saved = previous.get(name, {})
            if not dirty and saved.get("hash") == digest:
                os.utime(path, ns=(path.stat().st_atime_ns, saved["mtime_ns"]))
            else:
                os.utime(path, None)
            current[name] = {"hash": digest, "mtime_ns": path.stat().st_mtime_ns}


        def visit(directory):
            entries = []
            dirty = False
            for entry in sorted(directory.iterdir()):
                name = entry.relative_to(root).as_posix()
                if entry.name == ".git":
                    continue
                if entry.is_dir() and (entry / ".rustc_info.json").exists():
                    entries.append([entry.name, "build-output"])
                    dirty = True
                elif entry.is_symlink():
                    entries.append([entry.name, "symlink", os.readlink(entry)])
                    dirty = True
                elif entry.is_dir():
                    digest, child_dirty = visit(entry)
                    entries.append([entry.name, "directory", digest])
                    dirty |= child_dirty
                elif not entry.is_file():
                    entries.append([entry.name, "unsupported"])
                    dirty = True
                elif name not in tracked:
                    entries.append([entry.name, "untracked"])
                    dirty = True
                else:
                    digest = hashlib.sha256(entry.read_bytes()).hexdigest()
                    restore(entry, digest)
                    entries.append([entry.name, "file", digest])
            digest = hashlib.sha256(json.dumps(entries, separators=(",", ":")).encode()).hexdigest()
            restore(directory, digest, dirty)
            return digest, dirty


        visit(root)
        manifest.parent.mkdir(parents=True, exist_ok=True)
        manifest.write_text(json.dumps(current))
        PYTHON

    - uses: actions/cache@v6
      if: runner.environment == 'github-hosted' || runner.os != 'Linux'
      with:
        path: ~/.aleo/resources
        key: aleo-resources-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
        restore-keys: aleo-resources-${{ runner.os }}-${{ runner.arch }}-

    - name: Create Aleo home
      shell: bash
      run: mkdir -p "$HOME/.aleo"

    - uses: taiki-e/install-action@v2
      if: inputs.nextest == 'true'
      with:
        tool: cargo-nextest@0.9.114

    - uses: actions/cache/restore@v6
      if: inputs.snarkos == 'true'
      id: snarkos-cache
      with:
        path: ~/.cache/leo-ci-snarkos
        key: snarkos-test-network-${{ runner.os }}-${{ runner.arch }}-${{ runner.environment }}-rust-1.96.0-${{ hashFiles('.resources/snarkos-version') }}

    - name: Install snarkOS
      if: inputs.snarkos == 'true'
      shell: bash
      env:
        CACHE_HIT: ${{ steps.snarkos-cache.outputs.cache-hit }}
        CARGO_PROFILE_RELEASE_LTO: 'off'
        CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
        CARGO_PROFILE_RELEASE_OPT_LEVEL: '2'
        CARGO_PROFILE_RELEASE_DEBUG: '0'
      run: |
        version="$(tr -d '[:space:]' < .resources/snarkos-version)"
        root="$HOME/.cache/leo-ci-snarkos"
        if [ "$CACHE_HIT" != true ] || [ ! -x "$root/bin/snarkos" ]; then
          cargo install snarkos --locked --version "$version" --features test_network --root "$root" --force
        fi
        "$root/bin/snarkos" --version
        echo "$root/bin" >> "$GITHUB_PATH"

    - uses: actions/cache/save@v6
      if: inputs.snarkos == 'true' && steps.snarkos-cache.outputs.cache-hit != 'true'
      with:
        path: ~/.cache/leo-ci-snarkos
        key: ${{ steps.snarkos-cache.outputs.cache-primary-key }}
