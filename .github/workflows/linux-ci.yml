name: Linux CI

on:
  workflow_call:
    inputs:
      suite:
        description: Run workspace tests or Rust checks.
        required: true
        type: string

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: '0'
  CARGO_NET_GIT_FETCH_WITH_CLI: 'true'

jobs:
  linux-tests:
    name: linux-workspace-tests
    if: inputs.suite == 'workspace'
    # The runner group restricts access to an approved commit. Select the runner from the original event.
    runs-on: &linux-runner >-
      ${{ fromJSON(
      github.repository == 'aleo-labs-protocol/leo' &&
      (((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/master') ||
       (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.login != 'dependabot[bot]')) &&
      '["self-hosted", "linux", "x64", "cpu"]' || '["ubuntu-24.04"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          cache-key: linux-ci-only-testnet
          nextest: 'true'
          snarkos: 'true'
      - name: Prepare the shared runner test environment
        if: runner.environment == 'self-hosted'
        run: |
          nproc
          free -h
          getconf GNU_LIBC_VERSION
          tmpdir="$(mktemp -d "$RUNNER_TEMP/leo-XXXXXXXX")"
          echo "TMPDIR=$tmpdir" >> "$GITHUB_ENV"
      - name: Build the workspace tests
        run: |
          ulimit -n 65536
          start=$SECONDS
          cargo nextest run --no-run --all --locked --cargo-profile ci --features only_testnet
          echo "Linux test build: $((SECONDS - start)) seconds." >> "$GITHUB_STEP_SUMMARY"
      - name: Run the workspace tests
        run: |
          ulimit -n 65536
          start=$SECONDS
          cargo nextest run --all --locked --cargo-profile ci --features only_testnet --verbose
          echo "Linux test execution: $((SECONDS - start)) seconds." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-mismatches
          path: tests/mismatches
          if-no-files-found: ignore

  rust-checks:
    name: ${{ matrix.check }}
    if: inputs.suite == 'rust'
    runs-on: *linux-runner
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, fmt-validate, cargo-doc]
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-ci
        with:
          cache-key: ${{ matrix.check }}
          nextest: ${{ matrix.check == 'fmt-validate' }}
      - name: Clippy
        if: matrix.check == 'clippy'
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Validate formatter semantics
        if: matrix.check == 'fmt-validate'
        run: |
          cargo nextest run -p leo-fmt --locked --cargo-profile ci --features validate \
            -E 'test(/validate_/) - test(validate_ast_equivalence_repos)'
      - name: Build Cargo documentation
        if: matrix.check == 'cargo-doc'
        env:
          RUSTDOCFLAGS: --enable-index-page -Zunstable-options
          RUSTC_BOOTSTRAP: '1'
        run: cargo doc --no-deps --document-private-items --workspace
